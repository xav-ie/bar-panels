name: CI

# Run once per change: `pull_request` covers branches/PRs, `push` only on main
# (post-merge). Scoping push to main avoids the double run you'd get when a
# same-repo branch has an open PR (push + pull_request both firing).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # BarPanels is AppKit, so its build and checks only exist for aarch64-darwin:
  # the library, the previews tool (which builds against its public API) and
  # formatting.
  check:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No id-token: given one, the installer logs in to FlakeHub and adds its
      # cache, which this repo isn't authorized for (every fetch warns 401).
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check --no-write-lock-file ./dev
